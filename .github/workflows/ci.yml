# Proves on every push that the public tree builds and passes its tests with no keys at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew testDebugUnitTest :desktop:test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
